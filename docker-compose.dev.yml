# Development docker-compose (chỉ database)
services:
  postgres:
    image: postgres:16-alpine
    container_name: familybank-db-dev
    environment:
      POSTGRES_USER: familybank
      POSTGRES_PASSWORD: familybank123
      POSTGRES_DB: familybank
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familybank"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
