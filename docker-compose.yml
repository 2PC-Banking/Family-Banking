services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: familybank-db
    environment:
      POSTGRES_USER: familybank
      POSTGRES_PASSWORD: familybank123
      POSTGRES_DB: familybank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familybank"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - familybank-network

  # .NET API
  api:
    build:
      context: .
      dockerfile: src/FamilyBank.Api/Dockerfile
    container_name: familybank-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=familybank;Username=familybank;Password=familybank123
      - Jwt__SecretKey=FamilyBankSuperSecretKey2024ForJWTTokenGeneration!@#
      - Jwt__Issuer=FamilyBank
      - Jwt__Audience=FamilyBankApp
      - Jwt__ExpiryMinutes=60
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - familybank-network

  # React Frontend
  web:
    build:
      context: ./src/family-bank-web
      dockerfile: Dockerfile
    container_name: familybank-web
    environment:
      - VITE_API_URL=http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - familybank-network

volumes:
  postgres_data:

networks:
  familybank-network:
    driver: bridge
